<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Little Message For You</title>
  <style>
    :root {
      --bg: #100914;
      --pink: #ff6f9f;
      --soft-pink: #ffc5d9;
      --cream: #fff5f8;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
      overflow-y: auto;
      display: grid;
      place-items: center;
      padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      color: var(--cream);
      font-family: Georgia, 'Times New Roman', serif;
      background:
        radial-gradient(circle at 50% 35%, #3a1733 0%, transparent 34%),
        radial-gradient(circle at 15% 85%, #28102b 0%, transparent 30%),
        var(--bg);
    }

    .stars, .hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .stars {
      opacity: .65;
      background-image:
        radial-gradient(#fff 1px, transparent 1px),
        radial-gradient(#ffd8e6 1px, transparent 1px);
      background-size: 88px 88px, 137px 137px;
      background-position: 10px 18px, 45px 70px;
    }

    .heart {
      position: absolute;
      color: var(--pink);
      opacity: 0;
      font-size: 18px;
      filter: drop-shadow(0 0 10px #ff4d91);
    }

    .floating-heart {
      position: absolute;
      bottom: -40px;
      color: var(--pink);
      font-size: clamp(14px, 3vw, 26px);
      opacity: 0;
      filter: drop-shadow(0 0 12px #ff4d91);
      will-change: transform, opacity;
    }

    main {
      position: relative;
      z-index: 2;
      width: min(100%, 700px);
      min-height: calc(100vh - 36px);
      min-height: calc(100svh - 36px);
      text-align: center;
      margin: auto;
      padding: clamp(24px, 7vh, 72px) clamp(8px, 4vw, 32px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .eyebrow {
      margin: 0 auto clamp(16px, 3vh, 28px);
      max-width: 34em;
      color: var(--soft-pink);
      font: 600 12px/1.4 Arial, sans-serif;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      min-height: 1.25em;
      color: var(--cream);
      font-size: clamp(2.35rem, 9vw, 4.75rem);
      font-weight: 400;
      line-height: 1.1;
      overflow-wrap: break-word;
      text-shadow: 0 0 30px rgba(255, 111, 159, .3);
    }

    .word { display: inline-block; opacity: 0; transform: translateY(20px); margin: 0 .08em; }

    .subtext {
      margin: clamp(20px, 4vh, 30px) auto clamp(24px, 5vh, 38px);
      max-width: 520px;
      color: #e8cbd7;
      font-size: clamp(1rem, 3.5vw, 1.375rem);
      line-height: 1.6;
      opacity: 0;
    }

    button {
      border: 1px solid rgba(255, 197, 217, .5);
      border-radius: 999px;
      min-height: 52px;
      max-width: 100%;
      padding: 15px 24px;
      color: #351222;
      background: linear-gradient(135deg, #ffd8e5, #ff8fb5);
      box-shadow: 0 0 24px rgba(255, 111, 159, .25);
      cursor: pointer;
      font: 700 15px/1.25 Arial, sans-serif;
      transition: transform .25s ease, box-shadow .25s ease;
      opacity: 0;
    }

    button:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 0 34px rgba(255, 111, 159, .55); }
    button:active { transform: scale(.98); }
    button:disabled { cursor: default; }

    #finalMessage {
      display: none;
      margin: 34px auto 0;
      color: #fff;
      max-width: 100%;
      font-size: clamp(2.5rem, 12vw, 5.25rem);
      line-height: 1.1;
      overflow-wrap: anywhere;
      text-shadow: 0 0 25px rgba(255, 111, 159, .85), 0 0 60px rgba(255, 111, 159, .4);
    }

    #loadingMessage {
      display: none;
      margin: 30px auto 0;
      max-width: 28em;
      color: var(--soft-pink);
      font-size: clamp(1.1rem, 4vw, 1.55rem);
      line-height: 1.6;
      font-style: italic;
      text-shadow: 0 0 18px rgba(255, 111, 159, .35);
      animation: loading-breathe 2.2s ease-in-out infinite;
    }

    .loading-dot { display: inline-block; animation: loading-bounce 1.2s infinite ease-in-out; }
    .loading-dot:nth-child(2) { animation-delay: .15s; }
    .loading-dot:nth-child(3) { animation-delay: .3s; }
    @keyframes loading-bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-5px); opacity: 1; } }
    @keyframes loading-breathe { 0%, 100% { opacity: .62; text-shadow: 0 0 12px rgba(255, 111, 159, .2); } 50% { opacity: 1; text-shadow: 0 0 28px rgba(255, 111, 159, .72); } }

    .signature { display: block; margin: 22px auto 0; max-width: 30em; color: var(--soft-pink); font-size: clamp(.9rem, 3vw, 1.125rem); line-height: 1.5; }
    .cursor { display: inline-block; width: 2px; height: .85em; margin-left: 5px; background: var(--pink); vertical-align: -.08em; animation: blink .8s infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    @media (max-width: 480px) {
      main { padding-inline: 0; }
      .eyebrow { letter-spacing: .18em; font-size: 10px; }
      .subtext { max-width: 22em; }
      button { width: min(100%, 310px); }
      #finalMessage { margin-top: 24px; }
    }

    @media (max-height: 560px) and (orientation: landscape) {
      body { place-items: start center; }
      main { padding-block: 18px; }
      .eyebrow { margin-bottom: 10px; }
      .subtext { margin-block: 14px 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  <div class="hearts" aria-hidden="true">
    <span class="heart" style="left:10%;top:80%">♥</span>
    <span class="heart" style="left:22%;top:20%">♥</span>
    <span class="heart" style="left:78%;top:76%">♥</span>
    <span class="heart" style="left:88%;top:25%">♥</span>
    <span class="heart" style="left:48%;top:88%">♥</span>
  </div>
  <main>
    <p class="eyebrow">A tiny program made just for you</p>
    <h1 id="intro"><span class="word">You</span><span class="word">are</span><span class="word">my</span><span class="word">favorite</span><span class="word">person.</span></h1>
    <p class="subtext">I ran every possible calculation, and somehow the answer keeps becoming you.</p>
    <button id="revealButton" type="button">Click to reveal the result ♥</button>
    <p id="loadingMessage">Gathering all the little reasons I adore you<span class="loading-dot">.</span><span class="loading-dot">.</span><span class="loading-dot">.</span></p>
    <div id="finalMessage" aria-live="polite"></div>
  </main>

  <!-- GSAP is used for the animations. An internet connection is needed for this CDN version. -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const words = document.querySelectorAll('.word');
    const subtext = document.querySelector('.subtext');
    const button = document.querySelector('#revealButton');
    const loadingMessage = document.querySelector('#loadingMessage');
    const finalMessage = document.querySelector('#finalMessage');
    const hearts = document.querySelectorAll('.heart');
    const loadingPhrases = [
      'Gathering all the little reasons I adore you',
      'Searching every corner of my heart',
      'Preparing something I have wanted to say'
    ];
    let loadingPhraseTimer;

    // Use GSAP when available; the small fallback keeps the message readable offline.
    const animate = (target, vars) => window.gsap ? gsap.to(target, vars) : Object.assign(target.style, {
      opacity: vars.opacity ?? 1,
      transform: vars.y ? 'translateY(0)' : target.style.transform
    });

    if (window.gsap) {
      const intro = gsap.timeline({ defaults: { ease: 'power3.out' } });
      intro.to(words, { opacity: 1, y: 0, duration: .7, stagger: .22 })
           .to(subtext, { opacity: 1, duration: 1 }, '-=.2')
           .to(button, { opacity: 1, y: 0, duration: .8 }, '-=.35');
      gsap.to(hearts, { opacity: .8, y: -35, duration: 4, stagger: .7, repeat: -1, yoyo: true, ease: 'sine.inOut' });
    } else {
      words.forEach(word => word.style.cssText = 'opacity:1;transform:none');
      subtext.style.opacity = 1;
      button.style.opacity = 1;
    }

    button.addEventListener('click', () => {
      button.disabled = true;
      button.textContent = 'Opening my heart...';
      startRomanticLoading();
      startFloatingHearts();

      if (window.gsap) {
        gsap.to(button, { opacity: 0, y: 15, duration: .5, onComplete: () => button.style.display = 'none' });
        gsap.to([document.querySelector('#intro'), subtext], {
          opacity: 0, y: -12, duration: .8, stagger: .08,
          onComplete: () => {
            document.querySelector('#intro').style.display = 'none';
            subtext.style.display = 'none';
          }
        });
        gsap.to(loadingMessage, { display: 'block', opacity: 1, y: 0, duration: 1.4, delay: .9, ease: 'power2.out' });
        gsap.delayedCall(9.8, revealSlowly);
      } else {
        button.style.display = 'none';
        document.querySelector('#intro').style.display = 'none';
        subtext.style.opacity = 0;
        subtext.style.display = 'none';
        loadingMessage.style.display = 'block';
        setTimeout(revealSlowly, 9000);
      }
    });

    function startFloatingHearts() {
      const container = document.querySelector('.hearts');
      setInterval(() => {
        const heart = document.createElement('span');
        heart.className = 'floating-heart';
        heart.textContent = Math.random() > .25 ? '♥' : '♡';
        heart.style.left = `${8 + Math.random() * 84}%`;
        heart.style.fontSize = `${14 + Math.random() * 18}px`;
        container.appendChild(heart);
        const duration = 5.5 + Math.random() * 4;
        if (window.gsap) {
          gsap.fromTo(heart, { opacity: 0, y: 0, x: 0, scale: .65, rotation: -12 }, {
            opacity: .72, y: `-${window.innerHeight + 100}px`, x: `${(Math.random() - .5) * 150}px`,
            scale: 1.15, rotation: 20, duration, ease: 'sine.out',
            onComplete: () => heart.remove()
          });
          gsap.to(heart, { opacity: 0, delay: duration - 1, duration: 1 });
        } else {
          heart.style.opacity = '.72';
          setTimeout(() => heart.remove(), duration * 1000);
        }
      }, 520);
    }

    function startRomanticLoading() {
      let phraseIndex = 0;
      loadingMessage.firstChild.textContent = loadingPhrases[phraseIndex];
      loadingPhraseTimer = setInterval(() => {
        phraseIndex = (phraseIndex + 1) % loadingPhrases.length;
        if (window.gsap) {
          gsap.to(loadingMessage, { opacity: 0, y: -4, duration: .7, ease: 'power1.inOut', onComplete: () => {
            loadingMessage.firstChild.textContent = loadingPhrases[phraseIndex];
            gsap.fromTo(loadingMessage, { opacity: 0, y: 4 }, { opacity: 1, y: 0, duration: 1.1, ease: 'power2.out' });
          }});
        } else {
          loadingMessage.firstChild.textContent = loadingPhrases[phraseIndex];
        }
      }, 3000);
    }

    function revealSlowly() {
      clearInterval(loadingPhraseTimer);
      if (window.gsap) {
        gsap.to(loadingMessage, { opacity: 0, y: -8, duration: 1.2, ease: 'power2.inOut', onComplete: () => loadingMessage.style.display = 'none' });
      } else {
        loadingMessage.style.display = 'none';
      }
      finalMessage.style.display = 'block';
      const message = 'I love you';
      finalMessage.innerHTML = [...message].map((letter, i) =>
        `<span class="letter" style="display:inline-block;opacity:0;transform:translateY(16px)">${letter === ' ' ? '&nbsp;' : letter}</span>`
      ).join('') + '<span class="cursor"></span><span class="signature">— always and in every version of my future</span>';

      const letters = finalMessage.querySelectorAll('.letter');
      if (window.gsap) {
        gsap.fromTo(finalMessage, { scale: .72, opacity: 0, y: 18 }, { scale: 1, opacity: 1, y: 0, duration: 2.2, ease: 'power3.out' });
        gsap.to(letters, { opacity: 1, y: 0, duration: 1.6, stagger: .38, delay: .5, ease: 'power2.out' });
        gsap.from('.signature', { opacity: 0, y: 12, duration: 1.8, delay: 5.3, ease: 'power2.out' });
        gsap.to('.cursor', { opacity: 0, duration: .7, repeat: 5, yoyo: true, delay: 5.4 });
        gsap.to(hearts, { scale: 1.5, opacity: 1, duration: 1.8, stagger: .12, delay: .8, ease: 'back.out(1.5)' });
      } else {
        letters.forEach(letter => letter.style.cssText = 'display:inline-block;opacity:1;transform:none');
      }
    }
  </script>
</body>
</html>
